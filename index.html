<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandarin Audio Player</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --border: #334155;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .chinese-word {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }
    .btn-play {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      padding: 1rem 2rem;
      font-size: 1.125rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      width: 100%;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .btn-play:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-play:active { transform: translateY(1px); }
    audio { width: 100%; margin-top: 0.5rem; border-radius: 0.5rem; }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      text-decoration: none;
      flex: 1;
    }
    .nav-btn:hover { background: rgba(0, 0, 0, 0.05); color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge" id="cardBadge">Card #1</div>
    <div class="chinese-word" id="chineseWord">...</div>

    <button class="btn-play" id="playBtn" onclick="playAudio()">
      🔊 Play Audio
    </button>

    <audio id="audioPlayer" controls preload="auto"></audio>

    <div class="nav-buttons">
      <a href="#" class="nav-btn" id="prevBtn">← Previous</a>
      <a href="#" class="nav-btn" id="nextBtn">Next →</a>
    </div>
  </div>

    const params = new URLSearchParams(window.location.search);
    const cardId = parseInt(params.get('id') || params.get('card') || '1', 10);
    const currentCard = CARDS.find(c => c.id === cardId) || CARDS[0];

    document.getElementById('cardBadge').textContent = `Card #${currentCard.id}`;
    document.getElementById('chineseWord').textContent = currentCard.word;
    document.title = `Mandarin Card #${currentCard.id} - ${currentCard.word}`;

    const audioPlayer = document.getElementById('audioPlayer');
    const audioUrl = `audio/${encodeURIComponent(currentCard.file)}`;
    audioPlayer.src = audioUrl;

    // Navigation setup
    const prevId = currentCard.id > 1 ? currentCard.id - 1 : CARDS.length;
    const nextId = currentCard.id < CARDS.length ? currentCard.id + 1 : 1;
    document.getElementById('prevBtn').href = `?id=${prevId}`;
    document.getElementById('nextBtn').href = `?id=${nextId}`;

    function playAudio() {
      audioPlayer.play().catch(err => {
        console.log("Autoplay blocked or playback error:", err);
      });
    }

    // Auto-play on load if possible
    window.addEventListener('load', () => {
